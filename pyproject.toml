[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dipm"
version = "0.0.1"
description = "v0 DSL core for design-intent -> parametric CAD (placeholder package name)"
requires-python = ">=3.12,<3.13"
# Pinned to the versions validated in spikes/01-occt-feasibility/requirements.lock.txt.
dependencies = [
    "build123d==0.13.0",
    "cadquery-ocp-novtk==8.0.1.1.0",
    # `dipm serve` (docs/gui.md): local web GUI server
    "numpy==2.5.5",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
    "watchfiles==1.3.0",
    "websockets==17.4",
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "httpx2==2.16.2"]

[project.scripts]
dipm = "dipm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dipm = ["NOTES.md", "server/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
